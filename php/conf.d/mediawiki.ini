; MediaWiki recommended PHP tuning (egg defaults)
; Extensions themselves are loaded via scan_dir → /etc/php/VERSION/fpm/conf.d

[apcu]
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 128M
apc.ttl = 3600

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
